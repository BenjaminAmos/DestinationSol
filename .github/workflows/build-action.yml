name: Build Destination Sol
on: push

jobs:
  build-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set-up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 6.8
          arguments: distZipUnbundledJRE
      - uses: actions/upload-artifact@v3
        with:
          name: DestinationSol.zip
          path: desktop/build/distributions/DestinationSol.zip
      - name: Set-up Android Build
        run: echo sdk.dir=$ANDROID_SDK_ROOT > local.properties
      - name: Clone Android Facade
        uses: actions/checkout@v3
        with:
          repository: MovingBlocks/DestSolAndroid
          path: android
      - name: Build Android with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 6.8
          arguments: ':android:assembleDebug'
      - uses: actions/upload-artifact@v3
        with:
          name: android-debug.apk
          path: android/build/outputs/apk/debug/android-debug.apk
